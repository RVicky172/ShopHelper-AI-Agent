# Fast checks only, so a commit stays quick. scripts/check.sh runs everything else.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        types: [python]
      - id: biome
        name: biome
        entry: bash -c "cd web && npx biome check ."
        language: system
        files: ^web/
        pass_filenames: false
