[project]
name = "shophelper"
version = "0.1.0"
description = "ShopHelper: a customer-support AI agent on AWS Bedrock (learning project)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=1.0",
    "langchain-aws>=1.0",
    "langgraph-checkpoint-aws>=1.0",
    "langchain-mcp-adapters>=0.1",
    "mcp>=1.20",
    "langsmith>=0.4",
    "langchain-openai>=1.7.3",
    "openai>=3.45.0",
    "psycopg[binary]>=3.3.7",
    "psycopg-pool>=3.3.3",
    "pgvector>=0.5.1",
    "langgraph-checkpoint-postgres>=3.2.0",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "pyright>=1.1.414",
    "pre-commit>=4.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shophelper"]

[tool.pytest.ini_options]
testpaths = ["tests"]  # evals run separately: RUN_EVALS=1 pytest evals
pythonpath = ["src", "tests", "evals"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["evals: hits real AWS Bedrock (set RUN_EVALS=1)"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["shophelper", "fakes", "judge"]
