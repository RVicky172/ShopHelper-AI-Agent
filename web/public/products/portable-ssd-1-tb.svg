  <rect class="ink" x="296" y="320" width="44" height="24" rx="6"/>
  <rect class="body" x="86" y="128" width="228" height="144" rx="20"/>
  <rect class="ink" x="116" y="164" width="104" height="14" rx="4"/>
  <rect class="ink" x="116" y="194" width="104" height="14" rx="4"/>
  <rect class="ink" x="116" y="224" width="104" height="14" rx="4"/>
  <circle class="ink" cx="272" cy="200" r="10"/>
</svg>
