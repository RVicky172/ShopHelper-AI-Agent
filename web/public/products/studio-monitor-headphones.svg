  <circle class="body" cx="302" cy="248" r="50"/>
  <circle class="ink" cx="98" cy="248" r="26"/>
  <circle class="ink" cx="302" cy="248" r="26"/>
  <path class="line" d="M98 298 C98 350 170 356 200 332 C226 312 250 340 262 346"/>
  <rect class="ink" x="258" y="336" width="34" height="18" rx="5"/>
</svg>
