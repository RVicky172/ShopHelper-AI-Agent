<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Studio Monitor Headphones</title>
  <style>
    svg { --tint: #DCE4FF; --ink: #1B2340; --paper: #FFFFFF; }
    @media (prefers-color-scheme: dark) { svg { --tint: #2A3563; --ink: #EEF1F8; --paper: #141A2E; } }
    .tint { fill: var(--tint); }
    .ink { fill: var(--ink); }
    .paper { fill: var(--paper); }
    .body { fill: var(--paper); stroke: var(--ink); stroke-width: 6; stroke-linejoin: round; }
    .line { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect class="tint" width="400" height="400"/>
