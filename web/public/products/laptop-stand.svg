<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Laptop Stand</title>
  <style>
    svg { --tint: #D8EEF0; --ink: #1B2340; --paper: #FFFFFF; }
    @media (prefers-color-scheme: dark) { svg { --tint: #1F4A50; --ink: #EEF1F8; --paper: #141A2E; } }
    .tint { fill: var(--tint); }
    .ink { fill: var(--ink); }
    .paper { fill: var(--paper); }
    .body { fill: var(--paper); stroke: var(--ink); stroke-width: 6; stroke-linejoin: round; }
    .line { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect class="tint" width="400" height="400"/>
  <g transform="translate(-12 26)">
  <rect class="body" x="244" y="196" width="20" height="112"/>
  <rect class="body" x="120" y="254" width="20" height="54"/>
  <rect class="body" x="92" y="302" width="216" height="14" rx="4"/>
  <g transform="rotate(-20 200 224)">
    <rect class="body" x="84" y="222" width="232" height="14" rx="4"/>
    <rect class="body" x="84" y="204" width="12" height="20" rx="3"/>
    <rect class="ink" x="108" y="206" width="200" height="16" rx="3"/>
    <rect class="body" transform="rotate(16 304 214)" x="298" y="92" width="14" height="122" rx="4"/>
  </g>
  </g>
</svg>
