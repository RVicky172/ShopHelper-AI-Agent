  <title>Noise-Cancelling Headphones</title>
  <style>
    svg { --tint: #DCE4FF; --ink: #1B2340; --paper: #FFFFFF; }
    @media (prefers-color-scheme: dark) { svg { --tint: #2A3563; --ink: #EEF1F8; --paper: #141A2E; } }
