<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Insulated Water Bottle</title>
  <style>
    svg { --tint: #D9F0E8; --ink: #1B2340; --paper: #FFFFFF; }
    @media (prefers-color-scheme: dark) { svg { --tint: #1F4C3F; --ink: #EEF1F8; --paper: #141A2E; } }
    .tint { fill: var(--tint); }
    .ink { fill: var(--ink); }
    .paper { fill: var(--paper); }
    .body { fill: var(--paper); stroke: var(--ink); stroke-width: 6; stroke-linejoin: round; }
    .line { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect class="tint" width="400" height="400"/>
  <path class="line" d="M182 66 Q200 34 218 66"/>
  <rect class="ink" x="160" y="62" width="80" height="54" rx="10"/>
  <rect class="body" x="172" y="112" width="56" height="26"/>
  <rect class="body" x="134" y="134" width="132" height="214" rx="30"/>
  <rect class="ink" x="134" y="210" width="132" height="44"/>
</svg>
