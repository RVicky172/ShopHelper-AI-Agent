<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Car Phone Mount</title>
  <style>
    svg { --tint: #FBE3DC; --ink: #1B2340; --paper: #FFFFFF; }
    @media (prefers-color-scheme: dark) { svg { --tint: #5A3229; --ink: #EEF1F8; --paper: #141A2E; } }
    .tint { fill: var(--tint); }
    .ink { fill: var(--ink); }
    .paper { fill: var(--paper); }
