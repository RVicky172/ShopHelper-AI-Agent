<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Phone Grip Stand</title>
  <style>
    svg { --tint: #FBE3DC; --ink: #1B2340; --paper: #FFFFFF; }
    @media (prefers-color-scheme: dark) { svg { --tint: #5A3229; --ink: #EEF1F8; --paper: #141A2E; } }
    .tint { fill: var(--tint); }
    .ink { fill: var(--ink); }
    .paper { fill: var(--paper); }
    .body { fill: var(--paper); stroke: var(--ink); stroke-width: 6; stroke-linejoin: round; }
    .line { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect class="tint" width="400" height="400"/>
  <rect class="ink" x="184" y="262" width="32" height="38"/>
  <rect class="ink" x="124" y="294" width="152" height="28" rx="14"/>
  <circle class="body" cx="200" cy="164" r="102"/>
  <circle class="tint" cx="200" cy="164" r="66"/>
  <circle class="line" cx="200" cy="164" r="66"/>
</svg>
